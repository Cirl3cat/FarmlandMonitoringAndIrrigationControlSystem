<svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
>
  <!-- 太阳主体 -->
  <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>

  <!-- 上方光芒 -->
  <rect x="10.5" y="2" width="3" height="4" fill="#FFFFFF" rx="1.5"/>

  <!-- 下方光芒 -->
  <rect x="10.5" y="18" width="3" height="4" fill="#FFFFFF" rx="1.5"/>

  <!-- 左方光芒 -->
  <rect x="2" y="10.5" width="4" height="3" fill="#FFFFFF" rx="1.5"/>

  <!-- 右方光芒 -->
  <rect x="18" y="10.5" width="4" height="3" fill="#FFFFFF" rx="1.5"/>

  <!-- 左上光芒 -->
  <rect x="5.5" y="5.5" width="3" height="4" fill="#FFFFFF" rx="1.5" transform="rotate(-45 7 7.5)"/>

  <!-- 右上光芒 -->
  <rect x="15.5" y="5.5" width="3" height="4" fill="#FFFFFF" rx="1.5" transform="rotate(45 17 7.5)"/>

  <!-- 左下光芒 -->
  <rect x="5.5" y="14.5" width="3" height="4" fill="#FFFFFF" rx="1.5" transform="rotate(45 7 16.5)"/>

  <!-- 右下光芒 -->
  <rect x="15.5" y="14.5" width="3" height="4" fill="#FFFFFF" rx="1.5" transform="rotate(-45 17 16.5)"/>
</svg>
